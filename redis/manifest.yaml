apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: redis 
  namespace: roboshop 
  # Below are the Deployment labels
  labels: 
    component: redis 
    project: roboshop 
    tier: database 
spec: 
  replicas: 1 
  # These are the labels Deplyment uses to to create pod replicas. This should match Pod labels.
  selector: 
    matchLabels: 
      component: redis 
      project: roboshop 
      tier: database
  # This is the Pod definition
  template: 
    metadata: 
      labels: 
        component: redis 
        project: roboshop 
        tier: database
    spec: 
      containers: 
      - name: redis 
        image: redis:7

---
# This is the  clusterIP service resource for the redis pod 
apiVersion: v1 
kind: Service 
metadata: 
  name: redis 
  namespace: roboshop
  labels: 
    component: redis 
    project: roboshop 
    tier: database 
spec: 
  selector:   
    component: redis 
    project: roboshop 
    tier: database 
  ports: 
  - protocol: TCP 
    port: 6379 # service port
    targetPort: 6379  # container port

