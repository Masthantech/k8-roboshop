apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: shipping
  namespace: roboshop 
  labels: 
    component: shipping 
    project: roboshop 
    tier: app 
data: 
  CART_ENDPOINT: "cart:8080" 
  DB_HOST: "mysql"  

---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: shipping 
  namespace: roboshop 
  # This is Deployment labels
  labels: 
    component: shipping 
    project: roboshop 
    tier: app 
spec: 
  replicas: 1 
  selector:  
  # these are pod labels that replicase set creates pod replicas, these should match pod labels
    matchLabels: 
      component: shipping 
      project: roboshop 
      tier: app 
  # This is the pod definition    
  template:  
    metadata: 
      labels: 
        component: shipping 
        project: roboshop 
        tier: app 
    spec: 
      containers: 
      - name: shipping 
        image: khizar111/shipping:v1  
        envFrom: 
        - configMapRef:
            name: shipping

--- 
# This is the clusterIP service resource for shipping pod 
apiVersion: v1 
kind: Service 
metadata: 
  name: shipping 
  namespace: roboshop 
  labels: 
    component: shipping 
    project: roboshop 
    tier: app 
spec: 
  selector:
    component: shipping 
    project: roboshop 
    tier: app 
  ports: 
  - protocol: TCP 
    port: 8080 #service port
    targetPort: 8080  # container port




