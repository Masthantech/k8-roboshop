apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: user
  namespace: roboshop 
  labels: 
    component: user 
    project: roboshop 
    tier: app 
data: 
  MONGO: "true" 
  REDIS_URL: "redis://redis:6379" 
  MONGO_URL: "mongodb://mongodb:27017/users"

---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: user 
  namespace: roboshop 
  # This is Deployment labels
  labels: 
    component: user 
    project: roboshop 
    tier: app 
spec: 
  replicas: 1 
  selector:  
  # these are pod labels that replicase set creates pod replicas, these should match pod labels
    matchLabels: 
      component: user 
      project: roboshop 
      tier: app 
  # This is the pod definition    
  template:  
    metadata: 
      labels: 
        component: user 
        project: roboshop 
        tier: app 
    spec: 
      containers: 
      - name: user 
        image: khizar111/user:v1  
        envFrom: 
        - configMapRef:
            name: user

--- 
# This is the clusterIP service resource for user pod 
apiVersion: v1 
kind: Service 
metadata: 
  name: user 
  namespace: roboshop 
  labels: 
    component: user 
    project: roboshop 
    tier: app 
spec: 
  selector:
    component: user 
    project: roboshop 
    tier: app 
  ports: 
  - protocol: TCP 
    port: 8080 #service port
    targetPort: 8080  # container port




