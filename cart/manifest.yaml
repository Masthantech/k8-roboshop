apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: cart
  namespace: roboshop 
  labels: 
    component: cart 
    project: roboshop 
    tier: app 
data: 
  CATALOGUE_HOST: "catalogue" 
  CATALOGUE_PORT: "8080" 
  REDIS_HOST: "redis"

---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: cart 
  namespace: roboshop 
  # This is Deployment labels
  labels: 
    component: cart 
    project: roboshop 
    tier: app 
spec: 
  replicas: 1 
  selector:  
  # these are pod labels that replicase set creates pod replicas, these should match pod labels
    matchLabels: 
      component: cart 
      project: roboshop 
      tier: app 
  # This is the pod definition    
  template:  
    metadata: 
      labels: 
        component: cart 
        project: roboshop 
        tier: app 
    spec: 
      containers: 
      - name: cart 
        image: khizar111/cart:v1  
        envFrom: 
        - configMapRef:
            name: cart

--- 
# This is the clusterIP service resource for cart pod 
apiVersion: v1 
kind: Service 
metadata: 
  name: cart 
  namespace: roboshop 
  labels: 
    component: cart 
    project: roboshop 
    tier: app 
spec: 
  selector:
    component: cart 
    project: roboshop 
    tier: app 
  ports: 
  - protocol: TCP 
    port: 8080 #service port
    targetPort: 8080  # container port




