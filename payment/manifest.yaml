
# This is the Secret for user credentils
apiVersion: v1 
kind: Secret 
metadata: 
  name: payment 
  namespace: roboshop
  labels: 
    component: payment 
    project: roboshop 
    tier: app 
data: 
  AMQP_USER: "cm9ib3Nob3A=" 
  AMQP_PASS: "cm9ib3Nob3AxMjM="
---
# This is the configmap for env varibales
apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: payment
  namespace: roboshop 
  labels: 
    component: payment 
    project: roboshop 
    tier: app 
data: 
  CART_HOST: "cart" 
  CART_PORT: "8080" 
  USER_HOST: "user" 
  USER_PORT: "8080" 
  AMQP_HOST: "rabbitmq" 

---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: payment 
  namespace: roboshop 
  # This is Deployment labels
  labels: 
    component: payment 
    project: roboshop 
    tier: app 
spec: 
  replicas: 1 
  selector:  
  # these are pod labels that replicase set creates pod replicas, these should match pod labels
    matchLabels: 
      component: payment 
      project: roboshop 
      tier: app 
  # This is the pod definition    
  template:  
    metadata: 
      labels: 
        component: payment 
        project: roboshop 
        tier: app 
    spec: 
      containers: 
      - name: payment 
        image: khizar111/payment:v1  
        envFrom: 
        - configMapRef:
            name: payment 
        - secretRef: 
            name: payment    
--- 
# This is the clusterIP service resource for payment pod 
apiVersion: v1 
kind: Service 
metadata: 
  name: payment 
  namespace: roboshop 
  labels: 
    component: payment 
    project: roboshop 
    tier: app 
spec: 
  selector:
    component: payment 
    project: roboshop 
    tier: app 
  ports: 
  - protocol: TCP 
    port: 8080 #service port
    targetPort: 8080  # container port




