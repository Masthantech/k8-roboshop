apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: rabbitmq 
  namespace: roboshop 
  # Below are the Deployment labels
  labels: 
    component: rabbitmq 
    project: roboshop 
    tier: database 
spec: 
  replicas: 1 
  # These are the labels Deplyment uses to to create pod replicas. This should match Pod labels.
  selector: 
    matchLabels: 
      component: rabbitmq 
      project: roboshop 
      tier: database
  # This is the Pod definition
  template: 
    metadata: 
      labels: 
        component: rabbitmq 
        project: roboshop 
        tier: database
    spec: 
      containers: 
      - name: rabbitmq 
        image: rabbitmq:3

---
# This is the  clusterIP service resource for the rabbitmq pod 
apiVersion: v1 
kind: Service 
metadata: 
  name: rabbitmq 
  namespace: roboshop
  labels: 
    component: rabbitmq 
    project: roboshop 
    tier: database 
spec: 
  selector:   
    component: rabbitmq 
    project: roboshop 
    tier: database 
  ports: 
  - protocol: TCP 
    port: 5672 # service port
    targetPort: 5672  # container port

