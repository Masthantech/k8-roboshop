apiVersion: v1 
kind: Secret 
metadata: 
  name: mysql 
  labels: 
    component: mysql 
    project: roboshop 
    tier: database 
data: 
  MYSQL_ROOT_PASSWORD: "Um9ib1Nob3BAMQ=="    

---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: mysql 
  namespace: roboshop 
  # Below are the Deployment labels
  labels: 
    component: mysql 
    project: roboshop 
    tier: database 
spec: 
  replicas: 1 
  # These are the labels Deplyment uses to to create pod replicas. This should match Pod labels.
  selector: 
    matchLabels: 
      component: mysql 
      project: roboshop 
      tier: database
  # This is the Pod definition
  template: 
    metadata: 
      labels: 
        component: mysql 
        project: roboshop 
        tier: database
    spec: 
      containers: 
      - name: mysql 
        image: khizar111/mysql:v1 
        envFrom:
        - secretRef:
            name: mysql
---
# This is the  clusterIP service resource for the mysql pod 
apiVersion: v1 
kind: Service 
metadata: 
  name: mysql 
  namespace: roboshop
  labels: 
    component: mysql 
    project: roboshop 
    tier: database 
spec: 
  selector:   
    component: mysql 
    project: roboshop 
    tier: database 
  ports: 
  - protocol: TCP 
    port: 3306 # service port
    targetPort: 3306  # container port

